<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://mempool.space https://blockstream.info">
  <title>Burner Wallet Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111; color: #eee; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      padding: 0; min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #0a0a0a; border-bottom: 1px solid #222; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 16px; color: #0ff; font-weight: 600; letter-spacing: 1px; }
    header .net-selector { display: flex; gap: 6px; }
    header .net-btn {
      background: #222; border: 1px solid #333; color: #888; padding: 4px 12px;
      border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit;
    }
    header .net-btn.active { background: #0ff; color: #111; border-color: #0ff; font-weight: 700; }
    main { flex: 1; padding: 24px; max-width: 720px; margin: 0 auto; width: 100%; }
    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #666;
      margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 6px;
    }
    .card {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 20px; margin-bottom: 12px;
    }
    .btn {
      background: #0ff; color: #111; border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 13px;
      font-family: inherit; transition: background 0.15s;
    }
    .btn:hover { background: #0dd; }
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
    .btn-outline {
      background: transparent; border: 1px solid #0ff; color: #0ff;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: inherit; transition: all 0.15s;
    }
    .btn-outline:hover { background: #0ff; color: #111; }
    .btn-sm { padding: 6px 12px; font-size: 11px; }
    .btn-danger { background: #f44; }
    .btn-danger:hover { background: #d33; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    input, textarea {
      background: #0a0a0a; border: 1px solid #333; color: #eee; padding: 10px 14px;
      border-radius: 6px; font-family: inherit; font-size: 13px; width: 100%;
    }
    input:focus, textarea:focus { outline: none; border-color: #0ff; }
    textarea { resize: vertical; min-height: 80px; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
    .addr {
      background: #0a0a0a; border: 1px solid #333; padding: 12px; border-radius: 6px;
      font-size: 14px; word-break: break-all; color: #0ff; user-select: all;
      cursor: pointer; margin-top: 8px;
    }
    .balance-display { font-size: 28px; font-weight: 700; color: #0ff; margin: 8px 0; }
    .balance-sub { font-size: 13px; color: #888; }
    .mnemonic-box {
      background: #0a0a0a; border: 1px solid #333; padding: 14px; border-radius: 6px;
      font-size: 14px; line-height: 1.8; color: #eee; word-spacing: 6px;
      user-select: all; cursor: pointer;
    }
    .mnemonic-hidden { filter: blur(8px); user-select: none; cursor: pointer; }
    .status { font-size: 12px; margin-top: 8px; }
    .status-ok { color: #4f4; }
    .status-err { color: #f44; }
    .status-info { color: #888; }
    .hidden { display: none !important; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid #333; border-top-color: #0ff; border-radius: 50%;
      animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer {
      background: #0a0a0a; border-top: 1px solid #222; padding: 10px 24px;
      font-size: 11px; color: #444; text-align: center;
    }
    .word-count-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .word-count-row label { margin: 0; }
    select {
      background: #0a0a0a; border: 1px solid #333; color: #eee; padding: 6px 10px;
      border-radius: 4px; font-family: inherit; font-size: 13px;
    }
    .tab-row { display: flex; gap: 0; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #888;
      padding: 10px; cursor: pointer; font-size: 13px; font-family: inherit;
      transition: all 0.15s; text-align: center;
    }
    .tab-btn:first-child { border-radius: 6px 0 0 6px; }
    .tab-btn:last-child { border-radius: 0 6px 6px 0; }
    .tab-btn.active { background: #0ff; color: #111; border-color: #0ff; font-weight: 700; }
    .copy-toast {
      position: fixed; bottom: 24px; right: 24px; background: #0ff; color: #111;
      padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
    }
    .copy-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>BURNER WALLET</h1>
    <div class="net-selector">
      <button class="net-btn" data-net="mainnet">Mainnet</button>
      <button class="net-btn active" data-net="testnet">Testnet</button>
      <button class="net-btn" data-net="signet">Signet</button>
    </div>
  </header>

  <main>
    <!-- Setup section: shown when no wallet loaded -->
    <div id="setup-section">
      <div class="section">
        <div class="section-title">Wallet Setup</div>
        <div class="tab-row">
          <button class="tab-btn active" data-tab="create">Create New</button>
          <button class="tab-btn" data-tab="import">Import Existing</button>
        </div>

        <!-- Create tab -->
        <div id="tab-create" class="card">
          <div class="word-count-row">
            <label>Word count:</label>
            <select id="word-count">
              <option value="12">12 words</option>
              <option value="24" selected>24 words</option>
            </select>
          </div>
          <div class="btn-row">
            <button class="btn" id="btn-generate">Generate Mnemonic</button>
          </div>
          <div id="generated-mnemonic" class="hidden" style="margin-top:16px;">
            <label>Your mnemonic (click to copy):</label>
            <div class="mnemonic-box" id="gen-mnemonic-text"></div>
            <p class="status status-err" style="margin-top:8px;">
              Write this down and store it securely. It cannot be recovered.
            </p>
            <div class="btn-row">
              <button class="btn" id="btn-use-generated">Use This Mnemonic</button>
            </div>
          </div>
        </div>

        <!-- Import tab -->
        <div id="tab-import" class="card hidden">
          <label>Enter your BIP39 mnemonic phrase:</label>
          <textarea id="import-mnemonic" placeholder="abandon abandon abandon ... about" rows="3"></textarea>
          <div id="import-status" class="status status-info" style="margin-top:8px;"></div>
          <div class="btn-row">
            <button class="btn" id="btn-import">Import Wallet</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard section: shown when wallet is loaded -->
    <div id="dashboard-section" class="hidden">
      <div class="section">
        <div class="section-title">Wallet Dashboard</div>
        <div class="card">
          <label>Network</label>
          <p id="dash-network" style="color:#0ff; font-size:14px; margin-bottom:16px;">testnet</p>

          <label>Mnemonic <span style="font-size:10px;color:#666;">(click to reveal/hide)</span></label>
          <div class="mnemonic-box mnemonic-hidden" id="dash-mnemonic" style="margin-bottom:16px;"></div>

          <label>Receiving Address (BIP84 m/84'/1'/0'/0/0)</label>
          <div class="addr" id="dash-address" title="Click to copy"></div>

          <div style="margin-top:20px;">
            <label>Balance</label>
            <div class="balance-display" id="dash-balance">-- sats</div>
            <div class="balance-sub" id="dash-balance-detail"></div>
          </div>

          <div class="btn-row">
            <button class="btn-outline" id="btn-sync">Sync Balance</button>
            <button class="btn-outline" id="btn-copy-addr">Copy Address</button>
            <button class="btn-outline btn-sm btn-danger" id="btn-clear-wallet">Clear Wallet</button>
          </div>
          <div id="sync-status" class="status status-info"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    Burner Wallet Companion &mdash; Air-gapped Bitcoin cold storage
  </footer>

  <div class="copy-toast" id="copy-toast">Copied to clipboard</div>

  <script src="renderer.js"></script>
</body>
</html>
