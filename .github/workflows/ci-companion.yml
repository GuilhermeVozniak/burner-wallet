name: CI Companion

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - "protocol/**"
  pull_request:
    branches: [main]
    paths:
      - "companion/**"
      - "protocol/**"

jobs:
  rust:
    name: Rust (core + tui)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting (core)
        working-directory: companion/core
        run: cargo fmt -- --check

      - name: Check formatting (tui)
        working-directory: companion/tui
        run: cargo fmt -- --check

      - name: Clippy (core)
        working-directory: companion/core
        run: cargo clippy -- -D warnings

      - name: Clippy (tui)
        working-directory: companion/tui
        run: cargo clippy -- -D warnings

      - name: Test core
        working-directory: companion/core
        run: cargo test

      - name: Test TUI
        working-directory: companion/tui
        run: cargo test

      - name: Test WASM bridge (native)
        working-directory: companion/core-wasm
        run: cargo test

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: companion/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  desktop:
    name: Desktop (Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: companion/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  extension:
    name: Extension (Chrome)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: companion/extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: companion/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm run build:check
