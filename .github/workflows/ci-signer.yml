name: CI Signer

on:
  push:
    branches: [main]
    paths:
      - "signer/**"
      - "protocol/**"
  pull_request:
    branches: [main]
    paths:
      - "signer/**"
      - "protocol/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Install Apache Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Run tests
        working-directory: signer
        run: ant test

      - name: Download ProGuard
        run: |
          curl -L -o /tmp/proguard-7.8.2.zip \
            https://github.com/Guardsquare/proguard/releases/download/v7.8.2/proguard-7.8.2.zip
          unzip -o /tmp/proguard-7.8.2.zip -d tools/
          ln -sf proguard-7.8.2 tools/proguard

      - name: Build
        working-directory: signer
        run: ant clean build

      - name: Size check
        working-directory: signer
        run: ant size-check
