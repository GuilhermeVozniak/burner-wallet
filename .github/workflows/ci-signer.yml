name: CI Signer

on:
  push:
    branches: [main]
    paths:
      - "signer/**"
      - "protocol/**"
  pull_request:
    branches: [main]
    paths:
      - "signer/**"
      - "protocol/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Install Apache Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Verify dependency hashes
        working-directory: signer
        run: ant verify-deps

      - name: Run tests
        working-directory: signer
        run: ant test

      - name: Download and verify ProGuard
        run: |
          curl -L -o /tmp/proguard-7.8.2.zip \
            https://github.com/Guardsquare/proguard/releases/download/v7.8.2/proguard-7.8.2.zip
          echo "Verifying ProGuard download integrity..."
          EXPECTED_SIZE=$(stat -c%s /tmp/proguard-7.8.2.zip 2>/dev/null || stat -f%z /tmp/proguard-7.8.2.zip)
          if [ "$EXPECTED_SIZE" -lt 1000000 ]; then
            echo "ERROR: ProGuard zip is suspiciously small ($EXPECTED_SIZE bytes)"
            exit 1
          fi
          unzip -o /tmp/proguard-7.8.2.zip -d tools/
          ln -sf proguard-7.8.2 tools/proguard
          ls -la tools/proguard/lib/proguard-ant.jar

      - name: Build
        working-directory: signer
        run: ant clean build

      - name: Size check
        working-directory: signer
        run: ant size-check
